    <h1>Delete Your TrimCal AI Account</h1>

    <p>You can request deletion of your TrimCal AI account and associated data.</p>

    <h2>How to delete your account</h2>

    <p>
        Open TrimCal AI and go to Settings → Account → Delete Account.
    </p>

    <p>
        If you're unable to access the app, contact support@aplusapps.app.
    </p>
